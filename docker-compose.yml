# SAAP - servidor de chão de fábrica
# Pipeline: ESP32 --MQTT--> Mosquitto --> Node-RED --> PostgreSQL --> Grafana
#
# Subir:   docker compose up -d
# Parar:   docker compose down
# Logs:    docker compose logs -f node-red

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: saap-mosquitto
    ports:
      - "1883:1883"        # MQTT (nós de bancada publicam aqui)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  postgres:
    image: postgres:16.15-alpine
    container_name: saap-postgres
    environment:
      - POSTGRES_DB=saap
      - POSTGRES_USER=saap
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # só roda no 1º boot (volume vazio)
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  node-red:
    build:
      context: ./node-red
    container_name: saap-node-red
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "1880:1880"        # editor Node-RED — mesma ressalva do Mosquitto/Postgres: só LAN
    volumes:
      - node_red_data:/data   # todo o userDir: node_modules, flows.json (copiado no build), credenciais
      # SEM bind mount do flows.json aqui: o Node-RED salva o fluxo renomeando
      # um arquivo temporário por cima dele, e isso falha (EBUSY) se o alvo for
      # um bind mount de arquivo único. flows.json entra no volume via COPY no
      # node-red/Dockerfile — ver o comentário lá para o fluxo de edição.
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: saap-grafana
    ports:
      - "3000:3000"        # painel de gestão: http://localhost:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=dark   # "sala de controle": o dashboard SAAP também força dark (dashboard JSON)
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s
      - GF_DATABASE_WAL=true                 # reduz "database is locked" no cartão SD
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false         # ninguém cria conta sozinho
      - GF_AUTH_ANONYMOUS_ENABLED=false      # sem acesso anônimo
      # Lido pelo provisionamento do datasource (grafana/provisioning/datasources/postgres.yml),
      # que expande $POSTGRES_PASSWORD — não duplique a senha lá.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-troque-esta-senha}
      # Acesso remoto via Tailscale serve/funnel (ver INSTALL-raspberrypi.md, seção 16):
      # descomente e troque SEU-TAILNET pelo nome real quando usar serve/funnel.
      # - GF_SERVER_ROOT_URL=https://cara.SEU-TAILNET.ts.net/
      # - GF_SERVER_ENFORCE_DOMAIN=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  mosquitto_data:
  postgres_data:
  node_red_data:
  grafana_data:
