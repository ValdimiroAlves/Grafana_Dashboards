# SAAP - servidor de chão de fábrica
# Pipeline: ESP32 --MQTT--> Mosquitto --> Telegraf --> InfluxDB --> Grafana
#
# Subir:   docker compose up -d
# Parar:   docker compose down
# Logs:    docker compose logs -f telegraf

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: saap-mosquitto
    ports:
      - "1883:1883"        # MQTT (nós de bancada publicam aqui)
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    container_name: saap-influxdb
    environment:
      - INFLUXDB_DB=saap
      - INFLUXDB_HTTP_AUTH_ENABLED=false   # dev: sem senha. Em produção, habilitar.
    volumes:
      - influxdb_data:/var/lib/influxdb
    restart: unless-stopped

  telegraf:
    image: telegraf:1.30
    container_name: saap-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: saap-grafana
    ports:
      - "3000:3000"        # painel de gestão: http://localhost:3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_DEFAULT_THEME=light
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s
      - GF_DATABASE_WAL=true                 # reduz "database is locked" no cartão SD
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_USERS_ALLOW_SIGN_UP=false         # ninguém cria conta sozinho
      - GF_AUTH_ANONYMOUS_ENABLED=false      # sem acesso anônimo
      # Acesso remoto via Tailscale serve/funnel (ver INSTALL-raspberrypi.md, seção 16):
      # descomente e troque SEU-TAILNET pelo nome real quando usar serve/funnel.
      # - GF_SERVER_ROOT_URL=https://cara.SEU-TAILNET.ts.net/
      # - GF_SERVER_ENFORCE_DOMAIN=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  mosquitto_data:
  influxdb_data:
  grafana_data:
