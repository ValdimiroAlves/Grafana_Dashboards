# Telegraf: consome o MQTT e grava no InfluxDB.
# Cada mensagem publicada pelos nós de bancada vira um ponto na measurement "producao".

[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# ---------- ENTRADA: MQTT ----------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  # tópico: fabrica/<setor>/bancada/<id>/evento
  topics = ["fabrica/+/bancada/+/evento"]
  qos = 1
  client_id = "telegraf-saap"

  data_format = "json"
  name_override = "producao"

  # "bancada" vira TAG (rótulo); os campos numéricos viram FIELDS.
  tag_keys = ["bancada"]
  json_string_fields = ["evt_id", "origem"]

  # usa o horário do evento vindo do nó, não o horário de chegada.
  # o formato ACEITA fração de segundo (.999999999) — sem isso, o Telegraf
  # trunca em segundos e o InfluxDB sobrescreve eventos da mesma bancada
  # que caem no mesmo segundo. O nó/simulador DEVE enviar ts com ms/us.
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05.999999999Z07:00"

# ---------- SAÍDA: InfluxDB ----------
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "saap"
  skip_database_creation = true
