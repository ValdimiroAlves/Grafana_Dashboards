listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

# passwd é gerado localmente (README.md, seção "Autenticação MQTT") e NÃO é
# versionado — mesmo com a senha em hash, é segredo de implantação, igual ao
# .env. Sem esse arquivo, o Mosquitto recusa iniciar (password_file ausente).
#
# TLS ainda não configurado: aceitável numa rede local de teste (RNF05 fala em
# "rede local de teste"), mas antes de expor a porta 1883 fora da LAN, adicione
# um listener com certificado.
